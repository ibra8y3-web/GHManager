name: Linux Build and Screenshot
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick x11-apps build-essential cmake
      - name: Build
        run: |
          if [ -f CMakeLists.txt ]; then cmake -S . -B build && cmake --build build -j2;
          elif [ -f Makefile ]; then make -j2;
          elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run app headless and take a screenshot
        continue-on-error: true
        run: |
          mkdir -p preview
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          export DISPLAY=:99
          APP="${APP_CMD:-}"
          if [ -z "$APP" ]; then
            if [ -f main.py ]; then APP="python3 main.py"
            elif [ -f build/app ]; then APP="build/app"
            else APP="$(find build -maxdepth 2 -type f -perm -u+x ! -name '*.so' | head -n1)"; fi
          fi
          echo "Running: $APP"
          ($APP &) ; sleep 8
          import -window root preview/screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview-screenshot
          path: preview
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build
            !build/**/CMakeFiles/**
          if-no-files-found: ignore
